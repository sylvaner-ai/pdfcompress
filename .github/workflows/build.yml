name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Tests du moteur Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - name: Ghostscript (bibliothèque)
        run: sudo apt-get update && sudo apt-get install -y libgs-dev ghostscript
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  macos:
    name: Application macOS
    needs: engine
    runs-on: macos-latest
    env:
      APP: app/build/Build/Products/Release/PDF Compress.app
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: brew install ghostscript dylibbundler xcodegen
      - name: Tests du moteur sur macOS
        run: cargo test --manifest-path engine/Cargo.toml
      - name: Générer le projet Xcode
        run: xcodegen
        working-directory: app
      - name: Construire l'application
        run: |
          xcodebuild -project app/PDFCompress.xcodeproj -scheme PDFCompress -configuration Release \
            -derivedDataPath app/build GS_LIB_DIR="$(brew --prefix)/lib" build
      - name: Embarquer Ghostscript
        run: scripts/bundle-ghostscript.sh "$APP"
      - name: Vérifier la compression avec le Ghostscript embarqué (sans Homebrew)
        run: scripts/check-bundle.sh "$APP"
      - name: Signer, notariser et créer le .dmg
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: scripts/package.sh "$APP" "PDF-Compress.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: PDF-Compress-macOS
          path: PDF-Compress.dmg
          if-no-files-found: error
