<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Compress</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <header data-tauri-drag-region>
      <span class="title" data-tauri-drag-region>PDF Compress</span>
      <button id="open-prefs" class="icon-btn" title="Préférences (⌘,)" aria-label="Préférences">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2" /><circle cx="9" cy="17" r="2" />
        </svg>
      </button>
    </header>

    <main>
      <section id="drop-zone" class="drop-zone">
        <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
            d="M14 6h14l10 10v24a2 2 0 0 1-2 2H14a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM28 6v10h10M24 22v12M19 29l5 5 5-5" />
        </svg>
        <p class="drop-title">Déposez vos PDF ici</p>
        <p class="drop-hint" id="drop-hint">Fichiers ou dossiers · compression sur place</p>
      </section>

      <ul id="files" class="files"></ul>
    </main>

    <footer id="summary" class="summary" hidden></footer>

    <div id="prefs" class="prefs" hidden>
      <div class="prefs-panel" role="dialog" aria-labelledby="prefs-title">
        <h2 id="prefs-title">Préférences</h2>

        <fieldset class="presets">
          <legend>Niveau de compression</legend>
          <label><input type="radio" name="preset" value="strong" /> <span><b>Forte</b><small>Fichiers les plus légers · 100 dpi</small></span></label>
          <label><input type="radio" name="preset" value="balanced" /> <span><b>Équilibrée</b><small>Recommandée · 150 dpi</small></span></label>
          <label><input type="radio" name="preset" value="light" /> <span><b>Légère</b><small>Qualité maximale · 220 dpi</small></span></label>
          <label><input type="radio" name="preset" value="custom" /> <span><b>Personnalisée</b><small>Réglages ci-dessous</small></span></label>
        </fieldset>

        <div class="sliders">
          <label for="dpi">Résolution des images <output id="dpi-out"></output></label>
          <input id="dpi" type="range" min="72" max="300" step="1" />
          <label for="quality">Qualité JPEG <output id="quality-out"></output></label>
          <input id="quality" type="range" min="20" max="95" step="1" />
        </div>

        <p id="engine" class="engine"></p>

        <div class="actions">
          <button id="close-prefs" class="primary">Fermer</button>
        </div>
      </div>
    </div>
  </body>
</html>
